# Dependabot opens pull requests when packages or workflow actions have updates.
# Minor and patch updates come grouped in one PR; each major version comes on its own,
# since a major (a new Vite or TypeScript, say) can need changes and deserves its own look.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
